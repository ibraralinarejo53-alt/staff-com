<!DOCTYPE html>
<html>
<head>
    <title>Staff System - By IBRAR ALI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div style="text-align:center; margin-bottom:10px;">
            <p style="background:#222; color:#fff; display:inline-block; padding:5px 15px; border-radius:20px; font-size:12px; letter-spacing:1px;">DEVELOPED BY IBRAR ALI</p>
        </div>

        <h1>Staff Management System</h1>
        <p style="text-align:center; color:#777; font-size:14px;">Manage Your Team Easily</p>
        
        <div class="buttons">
            <button onclick="showSection('add')">1. Add Staff</button>
            <button onclick="showSection('view')">2. View Staff</button>
            <button onclick="showSection('search')">3. Search Staff</button>
        </div>

        <!-- Add Staff -->
        <div id="add" class="section">
            <h2>Add Staff</h2>
            <input type="text" id="staffId" placeholder="Enter Staff ID">
            <input type="text" id="staffName" placeholder="Enter Staff Name">
            <input type="text" id="supportArea" placeholder="Enter Support Area">
            <button class="add-btn" onclick="addStaff()">Register Staff</button>
            <p id="addMsg"></p>
        </div>

        <!-- View Staff -->
        <div id="view" class="section hidden">
            <h2>All Staff</h2>
            <button class="add-btn" onclick="viewStaff()">Show Staff</button>
            <div id="staffList"></div>
        </div>

        <!-- Search Staff -->
        <div id="search" class="section hidden">
            <h2>Search Staff</h2>
            <input type="text" id="searchId" placeholder="Enter Staff ID to Search">
            <button class="add-btn" onclick="searchStaff()">Search</button>
            <p id="searchResult"></p>
        </div>

        <div style="text-align:center; margin-top:25px; border-top:1px solid #eee; padding-top:15px;">
            <p style="font-weight:bold; color:#14a800;">© 2026 IBRAR ALI</p>
            <p style="font-size:12px; color:#999;">IT Student | Larkana, Sindh</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
